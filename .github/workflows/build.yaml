name: Build Site (11ty)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source:
        description: Source requesting the website build
        required: false
        default: manual
  schedule:
    - cron: '17 */6 * * *'  # Low-frequency, off-peak fallback rebuild

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site with 11ty
        run: npm run build

      - name: Verify build output
        run: |
          set -eu
          for page in index.html homework_01.html homework_02.html lab_01.html; do
            if [ ! -s "docs/$page" ]; then
              echo "ERROR: required page docs/$page is missing or empty"
              exit 1
            fi
          done
          if ! grep -q '1eHTDqRj8guxWswoSMjxJ11HjK7kuo-4tc95QS6ZTS8U' docs/homework_02.html; then
            echo "ERROR: Homework 02 does not contain the published assignment link"
            exit 1
          fi
          for preview in \
            docs/static/labs/lab01/lab01-light.html \
            docs/static/labs/lab01/lab01-dark.html; do
            if [ ! -s "$preview" ]; then
              echo "ERROR: required Lab 01 preview $preview is missing or empty"
              exit 1
            fi
          done
          if ! grep -q 'static/labs/lab01/lab01-light.html' docs/lab_01.html; then
            echo "ERROR: Lab 01 does not contain the hosted HTML preview"
            exit 1
          fi
          if ! grep -q '../../css/bluegold.css' docs/static/labs/lab01/lab01-light.html; then
            echo "ERROR: Lab 01 light preview does not use the Bluegold theme"
            exit 1
          fi
          if ! grep -q '../../css/gruvbox-dark.css' docs/static/labs/lab01/lab01-dark.html; then
            echo "ERROR: Lab 01 dark preview does not use the Gruvbox theme"
            exit 1
          fi
          if ! grep -q 'data-theme="gruvbox-dark"' docs/static/labs/lab01/lab01-dark.html; then
            echo "ERROR: Lab 01 dark preview does not activate Gruvbox notebook colors"
            exit 1
          fi
          echo "Build verification passed"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
